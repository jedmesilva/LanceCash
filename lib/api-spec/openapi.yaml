openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account authentication operations
  - name: lance-cash
    description: Lance Cash prototype operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get the current authenticated account
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: No valid account session
  /auth/register:
    post:
      operationId: postAuthRegister
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegistrationInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid account details
        "409":
          description: Email is already in use
  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Sign in to an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentialsInput"
      responses:
        "200":
          description: Account signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid account details
        "401":
          description: Email or password is incorrect
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: Sign out the current account
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Account session ended
  /lance-cash/state:
    get:
      operationId: getLanceCashState
      tags: [lance-cash]
      summary: Get public auction state and optional account details
      responses:
        "200":
          description: Current account and auction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanceCashState"
  /lance-cash/bids/history:
    get:
      operationId: getLanceCashAuctionBids
      tags: [lance-cash]
      summary: Get an older page of auction bids
      parameters:
        - name: auctionId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: before
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: A page of bids, ordered newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionBidPage"
        "400":
          description: Invalid auction history request
  /lance-cash/bids:
    post:
      operationId: placeLanceCashBid
      tags: [lance-cash]
      summary: Place a bid on the active auction
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceBidInput"
      responses:
        "200":
          description: Updated auction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanceCashState"
        "400":
          description: Bid cannot be placed
        "401":
          description: Authentication required
  /lance-cash/packages/purchase:
    post:
      operationId: purchaseLancePackage
      tags: [lance-cash]
      summary: Add a simulated lance package to the balance
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasePackageInput"
      responses:
        "200":
          description: Updated account and auction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanceCashState"
        "400":
          description: Invalid package
        "401":
          description: Authentication required
  /lance-cash/profile:
    patch:
      operationId: updateLanceCashProfile
      tags: [lance-cash]
      summary: Update the authenticated account profile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated account and auction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanceCashState"
        "400":
          description: Invalid profile data
        "401":
          description: Authentication required
  /lance-cash/prizes/{auctionId}/redeem:
    post:
      operationId: redeemLanceCashPrize
      tags: [lance-cash]
      summary: Mark a simulated prize as redeemed
      security:
        - cookieAuth: []
      parameters:
        - name: auctionId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Updated account and auction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanceCashState"
        "400":
          description: Prize cannot be redeemed
        "404":
          description: Prize not found
        "401":
          description: Authentication required
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lance_cash_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthCredentialsInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 200
      required: [email, password]
    AuthRegistrationInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 200
      required: [name, email, password]
    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        isDemo:
          type: boolean
      required: [id, name, email, isDemo]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [user]
    PlaceBidInput:
      type: object
      properties:
        auctionId:
          type: integer
          minimum: 1
      required: [auctionId]
    PurchasePackageInput:
      type: object
      properties:
        packageId:
          type: string
          enum: [starter, value, popular, best]
        requestId:
          type: string
          format: uuid
      required: [packageId]
    ProfileUpdateInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        currentPassword:
          type: string
          maxLength: 200
        newPassword:
          type: string
          minLength: 8
          maxLength: 200
        confirmPassword:
          type: string
          maxLength: 200
      required: [name]
    AuctionBid:
      type: object
      properties:
        number:
          type: integer
          minimum: 1
        leader:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [number, leader, createdAt]
    AuctionBidPage:
      type: object
      properties:
        bids:
          type: array
          items:
            $ref: "#/components/schemas/AuctionBid"
        nextBefore:
          type: ["integer", "null"]
        hasMore:
          type: boolean
      required: [bids, nextBefore, hasMore]
    LancePackage:
      type: object
      properties:
        id:
          type: string
          enum: [starter, value, popular, best]
        bids:
          type: integer
        bonus:
          type: integer
        price:
          type: integer
        label:
          type: ["string", "null"]
      required: [id, bids, bonus, price, label]
    LanceCashAuction:
      type: object
      properties:
        id:
          type: integer
        prize:
          type: integer
        status:
          type: string
          enum: [live, ended, upcoming]
        bidCount:
          type: integer
        leader:
          type: string
        startedAt:
          type: ["string", "null"]
          format: date-time
        deadlineAt:
          type: ["string", "null"]
          format: date-time
        usedBids:
          type: integer
        bids:
          type: array
          items:
            $ref: "#/components/schemas/AuctionBid"
        historyHasMore:
          type: boolean
      required:
        - id
        - prize
        - status
        - bidCount
        - leader
        - startedAt
        - deadlineAt
        - usedBids
        - bids
        - historyHasMore
    LanceCashUser:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
      required: [name, email]
    LanceCashPrize:
      type: object
      properties:
        auctionId:
          type: integer
        prize:
          type: integer
        wonAt:
          type: string
          format: date-time
        redeemed:
          type: boolean
      required: [auctionId, prize, wonAt, redeemed]
    LanceCashState:
      type: object
      properties:
        balance:
          type: integer
        currentAuctionId:
          type: integer
        serverTime:
          type: string
          format: date-time
        user:
          oneOf:
            - $ref: "#/components/schemas/LanceCashUser"
            - type: "null"
        auctions:
          type: array
          items:
            $ref: "#/components/schemas/LanceCashAuction"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/LancePackage"
        prizes:
          type: array
          items:
            $ref: "#/components/schemas/LanceCashPrize"
      required: [balance, currentAuctionId, serverTime, user, auctions, packages, prizes]

