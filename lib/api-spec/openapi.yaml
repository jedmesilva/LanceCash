openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account authentication operations
  - name: lance-cash
    description: Lance Cash prototype operations
  - name: admin
    description: Protected auction administration operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get the current authenticated account
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: No valid account session
  /auth/register:
    post:
      operationId: postAuthRegister
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegistrationInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid account details
        "409":
          description: Email is already in use
  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Sign in to an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentialsInput"
      responses:
        "200":
          description: Account signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid account details
        "401":
          description: Email or password is incorrect
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: Sign out the current account
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Account session ended
  /lance-cash/state:
    get:
      operationId: getLanceCashState
      tags: [lance-cash]
      summary: Get the current auction window and account details
      responses:
        "200":
          description: Current account and auction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanceCashState"
  /lance-cash/auctions:
    get:
      operationId: getLanceCashAuctions
      tags: [lance-cash]
      summary: Get a cursor-paginated page of neighboring auctions
      parameters:
        - name: direction
          in: query
          required: true
          schema:
            type: string
            enum: [previous, next]
        - name: cursor
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        "200":
          description: A page of neighboring auctions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanceCashAuctionPage"
        "400":
          description: Invalid auction page request
  /lance-cash/bids/history:
    get:
      operationId: getLanceCashAuctionBids
      tags: [lance-cash]
      summary: Get an older page of auction bids
      parameters:
        - name: auctionId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: before
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: A page of bids, ordered newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionBidPage"
        "400":
          description: Invalid auction history request
  /lance-cash/bids:
    post:
      operationId: placeLanceCashBid
      tags: [lance-cash]
      summary: Place a bid on the active auction
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceBidInput"
      responses:
        "200":
          description: Updated auction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanceCashState"
        "400":
          description: Bid cannot be placed
        "401":
          description: Authentication required
  /lance-cash/packages/purchase:
    post:
      operationId: purchaseLancePackage
      tags: [lance-cash]
      summary: Add a simulated lance package to the balance
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasePackageInput"
      responses:
        "200":
          description: Updated account and auction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanceCashState"
        "400":
          description: Invalid package
        "401":
          description: Authentication required
  /lance-cash/profile:
    patch:
      operationId: updateLanceCashProfile
      tags: [lance-cash]
      summary: Update the authenticated account profile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated account and auction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanceCashState"
        "400":
          description: Invalid profile data
        "401":
          description: Authentication required
  /lance-cash/password:
    patch:
      operationId: changeLanceCashPassword
      tags: [lance-cash]
      summary: Change the authenticated account password
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordUpdateInput"
      responses:
        "200":
          description: Updated account and auction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanceCashState"
        "400":
          description: Invalid password data
        "401":
          description: Authentication required
  /lance-cash/prizes/{auctionId}/redeem:
    post:
      operationId: redeemLanceCashPrize
      tags: [lance-cash]
      summary: Mark a simulated prize as redeemed
      security:
        - cookieAuth: []
      parameters:
        - name: auctionId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Updated account and auction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanceCashState"
        "400":
          description: Prize cannot be redeemed
        "404":
          description: Prize not found
        "401":
          description: Authentication required
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check whether the admin access session is active
      responses:
        "200":
          description: Current admin session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionResponse"
    post:
      operationId: postAdminSession
      tags: [admin]
      summary: Create an admin session using the shared access key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccessInput"
      responses:
        "200":
          description: Admin session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionResponse"
        "400":
          description: Invalid access key format
        "401":
          description: Access key rejected
        "429":
          description: Too many attempts
    delete:
      operationId: deleteAdminSession
      tags: [admin]
      summary: End the admin access session
      responses:
        "204":
          description: Admin session ended
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get current auction monitoring and neighboring auction lists
      security:
        - adminCookieAuth: []
      responses:
        "200":
          description: Admin dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Admin access required
  /admin/auctions:
    get:
      operationId: getAdminAuctions
      tags: [admin]
      summary: List past or upcoming auctions
      security:
        - adminCookieAuth: []
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [ended, upcoming]
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: A page of auction records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuctionPage"
        "400":
          description: Invalid auction list request
        "401":
          description: Admin access required
  /admin/auction-bids:
    get:
      operationId: getAdminAuctionBids
      tags: [admin]
      summary: Search and page through bids for one auction
      security:
        - adminCookieAuth: []
      parameters:
        - name: auctionId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: before
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Auction summary and matching bid records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuctionBidsPage"
        "400":
          description: Invalid bid history request
        "401":
          description: Admin access required
        "404":
          description: Auction not found
  /admin/settings/system-bids:
    patch:
      operationId: updateAdminSystemBidsSettings
      tags: [admin]
      summary: Enable or disable automated system bids
      security:
        - adminCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSystemBidsSettingsUpdate"
      responses:
        "200":
          description: Updated automated bid setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSystemBidsSettingsResponse"
        "401":
          description: Admin access required
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lance_cash_session
    adminCookieAuth:
      type: apiKey
      in: cookie
      name: lance_cash_admin
  schemas:
    AdminAccessInput:
      type: object
      additionalProperties: false
      properties:
        accessKey:
          type: string
          minLength: 32
          maxLength: 512
      required: [accessKey]
    AdminSessionResponse:
      type: object
      properties:
        authenticated:
          type: boolean
      required: [authenticated]
    AdminAuctionSummary:
      type: object
      properties:
        id:
          type: integer
        prize:
          type: integer
        status:
          type: string
          enum: [live, ended, upcoming]
        bidCount:
          type: integer
        leader:
          type: string
        startedAt:
          type: ["string", "null"]
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, prize, status, bidCount, leader, startedAt, endedAt]
    AdminAuctionBid:
      type: object
      properties:
        id:
          type: integer
        number:
          type: integer
        leader:
          type: string
        isSystem:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, number, leader, isSystem, createdAt]
    AdminAuctionBidsPage:
      type: object
      properties:
        auction:
          $ref: "#/components/schemas/AdminAuctionSummary"
        bids:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuctionBid"
        nextBefore:
          type: ["integer", "null"]
        hasMore:
          type: boolean
      required: [auction, bids, nextBefore, hasMore]
    AdminAuctionPage:
      type: object
      properties:
        auctions:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuctionSummary"
        nextCursor:
          type: ["integer", "null"]
        hasMore:
          type: boolean
      required: [auctions, nextCursor, hasMore]
    AdminOverview:
      type: object
      properties:
        currentAuction:
          oneOf:
            - $ref: "#/components/schemas/AdminAuctionSummary"
            - type: "null"
        automatedBidCount:
          type: integer
        watcherCount:
          type: integer
        systemBidsEnabled:
          type: boolean
        previousAuctions:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuctionSummary"
        upcomingAuctions:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuctionSummary"
      required:
        - currentAuction
        - automatedBidCount
        - watcherCount
        - systemBidsEnabled
        - previousAuctions
        - upcomingAuctions
    AdminSystemBidsSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
      required: [enabled]
    AdminSystemBidsSettingsResponse:
      type: object
      properties:
        enabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time
      required: [enabled, updatedAt]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthCredentialsInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 200
      required: [email, password]
    AuthRegistrationInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 200
      required: [name, email, password]
    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        isDemo:
          type: boolean
      required: [id, name, email, isDemo]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [user]
    PlaceBidInput:
      type: object
      properties:
        auctionId:
          type: integer
          minimum: 1
      required: [auctionId]
    PurchasePackageInput:
      type: object
      properties:
        packageId:
          type: string
          enum: [starter, value, popular, best]
        requestId:
          type: string
          format: uuid
      required: [packageId]
    ProfileUpdateInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
      required: [name]
    PasswordUpdateInput:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 200
        newPassword:
          type: string
          minLength: 8
          maxLength: 200
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 200
      required: [currentPassword, newPassword, confirmPassword]
    AuctionBid:
      type: object
      properties:
        number:
          type: integer
          minimum: 1
        leader:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [number, leader, createdAt]
    AuctionBidPage:
      type: object
      properties:
        bids:
          type: array
          items:
            $ref: "#/components/schemas/AuctionBid"
        nextBefore:
          type: ["integer", "null"]
        hasMore:
          type: boolean
      required: [bids, nextBefore, hasMore]
    LancePackage:
      type: object
      properties:
        id:
          type: string
          enum: [starter, value, popular, best]
        bids:
          type: integer
        bonus:
          type: integer
        price:
          type: integer
        label:
          type: ["string", "null"]
      required: [id, bids, bonus, price, label]
    LanceCashAuction:
      type: object
      properties:
        id:
          type: integer
        prize:
          type: integer
        status:
          type: string
          enum: [live, ended, upcoming]
        bidCount:
          type: integer
        leader:
          type: string
        startedAt:
          type: ["string", "null"]
          format: date-time
        deadlineAt:
          type: ["string", "null"]
          format: date-time
        usedBids:
          type: integer
        bids:
          type: array
          items:
            $ref: "#/components/schemas/AuctionBid"
        historyHasMore:
          type: boolean
      required:
        - id
        - prize
        - status
        - bidCount
        - leader
        - startedAt
        - deadlineAt
        - usedBids
        - bids
        - historyHasMore
    LanceCashUser:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
      required: [name, email]
    LanceCashPrize:
      type: object
      properties:
        auctionId:
          type: integer
        prize:
          type: integer
        wonAt:
          type: string
          format: date-time
        redeemed:
          type: boolean
      required: [auctionId, prize, wonAt, redeemed]
    LanceCashState:
      type: object
      properties:
        balance:
          type: integer
        currentAuctionId:
          type: integer
        serverTime:
          type: string
          format: date-time
        user:
          oneOf:
            - $ref: "#/components/schemas/LanceCashUser"
            - type: "null"
        auctions:
          type: array
          items:
            $ref: "#/components/schemas/LanceCashAuction"
        auctionPagination:
          $ref: "#/components/schemas/LanceCashAuctionPagination"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/LancePackage"
        prizes:
          type: array
          items:
            $ref: "#/components/schemas/LanceCashPrize"
      required: [balance, currentAuctionId, serverTime, user, auctions, auctionPagination, packages, prizes]
    LanceCashAuctionPagination:
      type: object
      properties:
        previousCursor:
          type: ["integer", "null"]
        nextCursor:
          type: ["integer", "null"]
        hasPrevious:
          type: boolean
        hasNext:
          type: boolean
      required: [previousCursor, nextCursor, hasPrevious, hasNext]
    LanceCashAuctionPage:
      type: object
      properties:
        auctions:
          type: array
          items:
            $ref: "#/components/schemas/LanceCashAuction"
        direction:
          type: string
          enum: [previous, next]
        cursor:
          type: ["integer", "null"]
        hasMore:
          type: boolean
      required: [auctions, direction, cursor, hasMore]

